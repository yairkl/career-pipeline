name: Tailor CV

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  tailor:
    if: |
      github.event.issue.pull_request == null &&
      (contains(github.event.issue.labels.*.name, 'tailor-request') || 
       startsWith(github.event.issue.title, '[Application]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      branch_name: "tailor/${{ steps.sanitize_branch.outputs.sanitized_branch_name }}"
      pull_request_number: ${{ steps.cpr.outputs.pull-request-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Company and Role
        id: extract
        run: |
          title="${{ github.event.issue.title }}"
          # Remove [Application]: prefix if present
          title=${title#"[Application]: "}
          echo "company_role=$title" >> $GITHUB_OUTPUT

      - name: Run Tailor Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/tailor_engine.py \
            --jd "${{ github.event.issue.body }}" \
            --title "${{ steps.extract.outputs.company_role }}"

      - name: Create Sanitized Branch Name
        id: sanitize_branch
        run: |
          SANITIZED_BRANCH=$(python .github/scripts/sanitize_branch.py "${{ steps.extract.outputs.company_role }}")
          echo "sanitized_branch_name=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        id: cpr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Tailored CV for ${{ steps.extract.outputs.company_role }}"
          title: "Tailored CV: ${{ steps.extract.outputs.company_role }}"
          body: "This PR was automatically generated by the CareerPipeline Tailor Engine in response to Issue #${{ github.event.issue.number }}.\n\nCompany & Role: ${{ steps.extract.outputs.company_role }}"
          branch: "tailor/${{ steps.sanitize_branch.outputs.sanitized_branch_name }}"
          base: master
          draft: true

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Tailored CV generation started! A draft PR will be created shortly.'
            })
  trigger_pdf_gen:
      needs: tailor
      uses: ./.github/workflows/document-gen.yml
      with:
        branch_ref: ${{ needs.tailor.outputs.branch_name }}
        issue_number: ${{ github.event.issue.number }} # Pass issue ID to the next workflow
        pr_number: ${{ needs.tailor.outputs.pull_request_number }} # Ensure you have an output for PR
      permissions:
        contents: write
        pull-requests: write
        issues: write