name: Process PR Feedback

on:
  issue_comment:
    types: [created, edited]

jobs:
  process_feedback:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if comment is from PR author or maintainer
        id: check_author
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Allow if author or repo collaborator
            const isAuthor = comment.user.login === pr.data.user.login;
            const isAdmin = comment.author_association === 'OWNER' || 
                           comment.author_association === 'COLLABORATOR' ||
                           comment.author_association === 'MEMBER';
            
            if (isAuthor || isAdmin) {
              core.setOutput('can_process', 'true');
            } else {
              core.setOutput('can_process', 'false');
            }

      - name: Extract linked issue
        if: steps.check_author.outputs.can_process == 'true'
        id: extract_issue
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR details to find linked issue
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            
            // Try to extract issue number from PR body or linked issues
            let issueNumber = null;
            
            // Check for linked issues via API (GitHub GraphQL)
            try {
              const query = `
                query {
                  repository(owner: "${context.repo.owner}", name: "${context.repo.name}") {
                    pullRequest(number: ${context.issue.number}) {
                      closingIssuesReferences(first: 1) {
                        nodes {
                          number
                        }
                      }
                    }
                  }
                }
              `;
              // For simplicity, we'll extract from PR body pattern: "Issue #123"
            } catch (e) {
              console.log('GraphQL query failed, falling back to body parsing');
            }
            
            // Parse PR body for issue reference
            const bodyMatch = pr.data.body?.match(/#(\d+)/);
            if (bodyMatch) {
              issueNumber = bodyMatch[1];
            }
            
            if (issueNumber) {
              core.setOutput('issue_number', issueNumber);
              console.log(`Found linked issue: #${issueNumber}`);
            } else {
              core.setOutput('issue_number', '');
              console.log('No linked issue found');
            }

      - name: Get Job Description from Issue
        if: steps.extract_issue.outputs.issue_number != ''
        id: get_jd
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.extract_issue.outputs.issue_number }}
              });
              core.setOutput('job_description', issue.data.body);
              core.setOutput('company_role', issue.data.title);
            } catch (error) {
              core.warning(`Could not fetch issue: ${error.message}`);
              core.setOutput('job_description', '');
            }

      - name: Fetch PR Branch
        if: steps.check_author.outputs.can_process == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        if: steps.check_author.outputs.can_process == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        if: steps.check_author.outputs.can_process == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process Feedback
        if: steps.check_author.outputs.can_process == 'true'
        id: process_feedback
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEEDBACK: ${{ github.event.comment.body }}
          JOB_DESCRIPTION: ${{ steps.get_jd.outputs.job_description }}
        run: |
          python .github/scripts/feedback_engine.py \
            --feedback "$FEEDBACK" \
            --jd "$JOB_DESCRIPTION" \
            --company-role "${{ steps.get_jd.outputs.company_role }}"

      - name: Commit and Push Changes
        if: steps.check_author.outputs.can_process == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "Apply feedback from PR comment

            Feedback processed by feedback engine based on user input.
            Issue: #${{ steps.extract_issue.outputs.issue_number }}"
            git push
          fi

      - name: Comment on PR with Status
        if: steps.check_author.outputs.can_process == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const hasJD = '${{ steps.get_jd.outputs.job_description }}' !== '';
            let message = '✅ Feedback processed and CV updated!';
            
            if (!hasJD && '${{ steps.extract_issue.outputs.issue_number }}' === '') {
              message += '\n\n⚠️ Note: No linked issue found. Please ensure the issue is linked to this PR for better context.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })
