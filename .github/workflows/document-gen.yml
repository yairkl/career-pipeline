name: Generate PDF from CV

on:
  push:
    branches: [master, 'tailor/**']
  pull_request:
  workflow_call:
    inputs:
      branch_ref: # New input to specify the branch
        type: string
        required: true
      issue_number:
        type: string
        required: false
      pr_number:
        type: string
        required: false

jobs:
  generate_pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_ref }} # Force checkout of the new branch
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate PDF (adaptive layout retry loop)
        run: |
          # 1. Run optimizer to select initial layout tier based on CV length
          python3 .github/scripts/layout_optimizer.py --cv CV.md

          # 2. Run PDF generation retry loop
          for i in {1..3}; do
            echo "=== PDF Generation Attempt $i ==="
            
            # Source generated layout variables
            if [ -f pandoc_vars.env ]; then
              source pandoc_vars.env
            else
              FONTSIZE="10pt"
              MARGIN="0.5in"
              LINESTRETCH="1.15"
              TIER="standard"
            fi
            
            echo "Selected layout tier: $TIER (Font: $FONTSIZE, Margin: $MARGIN, LineStretch: $LINESTRETCH)"
            
            # Run Pandoc using Docker to generate the PDF
            docker run --rm -v "$PWD:/data" -w /data pandoc/latex:latest \
              --standalone \
              --pdf-engine=xelatex \
              -H assets/layout_vars.tex \
              -H assets/header.tex \
              --variable=geometry:margin=$MARGIN \
              --variable=fontsize=$FONTSIZE \
              --variable=linestretch=$LINESTRETCH \
              -o CV.pdf \
              CV.md
            
            # Check the page count of the generated PDF
            if [ -f CV.pdf ]; then
              PAGES=$(pdfinfo CV.pdf | grep "Pages:" | awk '{print $2}')
              echo "Generated PDF has $PAGES page(s)."
              
              if [ "$PAGES" -le 1 ]; then
                echo "✅ Success: PDF fits on 1 page!"
                break
              else
                if [ "$TIER" = "tight" ]; then
                  echo "⚠️ Already at 'tight' tier and still exceeds 1 page. Proceeding with best-effort tight layout."
                  break
                else
                  echo "❌ PDF exceeds 1 page. Tightening layout and retrying..."
                  python3 .github/scripts/layout_optimizer.py --cv CV.md --tighten
                fi
              fi
            else
              echo "❌ Error: CV.pdf was not generated."
              exit 1
            fi
          done


      # NEW: Create a Release and upload the PDF
      # This only runs for 'tailor/' branches or master pushes
      - name: Release PDF
        if: startsWith(github.ref, 'refs/heads/tailor/') || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          # Use the branch name or issue number as the tag
          tag_name: ${{ inputs.branch_ref || github.ref_name }}-pdf
          name: "CV Build: ${{ inputs.branch_ref || github.ref_name }}"
          files: CV.pdf
          draft: false
          prerelease: true # Keeps it marked as a 'Pre-release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR and Issue
        uses: actions/github-script@v7
        with:
          script: |
            const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${{ inputs.branch_ref || github.ref_name }}-pdf`;
            const body = `✅ **PDF Generation Complete!**\n\nYou can download the tailored CV directly from the [Release Assets](${releaseUrl}).`;
            
            const prNumber = "${{ inputs.pr_number }}" || context.payload.pull_request?.number;
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(prNumber),
                body: body
              });
            }

            const issueNumber = "${{ inputs.issue_number }}";
            if (issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: `📄 Your tailored CV is ready!\n\n[Download PDF Release Asset](${releaseUrl})`
              });
            }