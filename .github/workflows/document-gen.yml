name: Generate PDF from CV

on:
  push:
    branches:
      - master
      - 'tailor/**'
    paths:
      - 'CV*.md'
      - '.github/workflows/document-gen.yml'
  pull_request:
    paths:
      - 'CV*.md'

jobs:
  generate_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y pandoc xelatex

      - name: Generate PDF from CV.md
        run: |
          python .github/scripts/generate_pdf.py CV.md -o CV.pdf
        continue-on-error: true

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            CV.pdf
            CV_tailored.pdf
          retention-days: 30

      - name: Comment on PR with PDF link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📄 PDFs generated! Download them from the [Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) section.'
            })
